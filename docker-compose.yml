services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: rag-ynov-api
    expose:
      - "8000"
    environment:
      - MAMMOUTH_API_KEY=${MAMMOUTH_API_KEY}
      - MAMMOUTH_BASE_URL=${MAMMOUTH_BASE_URL}
      - MAMMOUTH_CHAT_MODEL=${MAMMOUTH_CHAT_MODEL}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - LOG_LEVEL=${LOG_LEVEL}
      - CHAINLIT_AUTH_SECRET=${CHAINLIT_AUTH_SECRET}
      - CHAT_DB_PATH=/app/chat_data/chat.db
    env_file:
      - .env
    volumes:
      # Corpus read by /api/ingest. data/ is not in git nor in the image (.dockerignore),
      # so it is copied to this folder on the server. Hard-coded: Coolify resolves
      # "${VAR:-./data}" to its own app folder instead of reading the variable.
      # Local dev mounts ./data instead, via docker-compose.override.yml.
      - /data/rag-ynov:/app/data:ro
      # Accounts and conversations of the chat (SQLite): the only state worth a backup
      - chat_data:/app/chat_data
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: rag-ynov-qdrant
    expose:
      - "6333"
      - "6334"
    volumes:
      # New volume for 1.19: Qdrant 1.17 dropped the RocksDB storage of 1.13, which
      # cannot be upgraded directly. The index is rebuilt by re-ingesting.
      - qdrant_storage_v1_19:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  qdrant_storage_v1_19:
  chat_data: