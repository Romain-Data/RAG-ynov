services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: rag-ynov-api
    expose:
      - "8000"
    environment:
      - MAMMOUTH_API_KEY=${MAMMOUTH_API_KEY}
      - MAMMOUTH_BASE_URL=${MAMMOUTH_BASE_URL}
      - MAMMOUTH_CHAT_MODEL=${MAMMOUTH_CHAT_MODEL}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - LOG_LEVEL=${LOG_LEVEL}
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: rag-ynov-qdrant
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

volumes:
  qdrant_storage: