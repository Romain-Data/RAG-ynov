- id: EC-12
  title: Les questions sur d'autres écoles passent le seuil
  category: grading
  status: fixed
  questions: [q19, q26]
  discovered_in: 2026-10-02_28_calibration-seuil-0-45
  symptom: >
    « Quels sont les frais de scolarité de HEC Paris ? » et « Quelles sont les conditions
    d'admission à Polytechnique ? » ne peuvent pas être filtrées par le seuil.
  evidence: >
    Meilleurs scores 0,609 (HEC → une section Tarifs Ynov) et 0,593 (Polytechnique), au
    milieu des questions légitimes (0,497 à 0,887) : aucun seuil ne les sépare. Avant la
    correction (passage 25), le LLM déclinait déjà ces deux questions de lui-même.
  cause: Le vocabulaire (frais, admission) est le même que celui des questions Ynov.
  fix: >
    Préventif : règle 5 du prompt (ne répondre que sur Ynov). Passages 26-27 : « Je ne peux
    répondre qu'aux questions sur Ynov Campus. » Suivi par q19 et q26 (out_of_scope: llm).
  links: ["fix/prompt-and-threshold"]

- id: EC-13
  title: Le LLM invente une règle générale à partir de quelques exemples
  category: generation
  status: fixed
  questions: [q16]
  discovered_in: 2026-10-02_26_local-apres-prompt-seuil
  symptom: >
    Avec le premier nouveau prompt, « Quels BTS sont accessibles via Parcoursup ? » → liste
    5 BTS dont Communication et NDRC, et affirme « Tous les BTS Ynov sont post-bac et donc
    éligibles à Parcoursup ». Faux : seuls CIEL, SIO SLAM et SIO SISR le sont (page
    Admission). Avant, le LLM répondait honnêtement qu'il ne savait pas.
  evidence: >
    Passage 25 (prompt d'origine) : « sans réponse » ; passage 26 (prompt v1) : réponse
    fausse et assurée ; passage 27 (prompt v2) : de nouveau « sans réponse ». Le contexte ne
    contient que des pages BTS (la section Parcoursup n'est pas récupérée, EC-07).
  cause: >
    Les nouvelles règles poussent le LLM à répondre de façon générale ; sans contexte
    suffisant, il a généralisé au lieu de s'abstenir.
  fix: >
    Fin de la règle 1 du prompt : aucune déduction ni généralisation qui n'est pas écrite
    dans le contexte. Contrôle automatique renforcé (q16 answer_must_not). La vraie
    correction de q16 reste la recherche (EC-07).
  links: ["fix/prompt-and-threshold"]

- id: EC-14
  title: Un chunk sépare des chiffres du titre auquel ils se rapportent
  category: chunking
  status: fixed
  questions: [q15]
  discovered_in: 2026-10-02_34_local-e5-large-300
  symptom: >
    Avec e5-large, « Quel est le taux de réussite du titre Expert en développement
    logiciel ? » → « 79 %, 121 certifiés sur 154 » : ce sont les chiffres des apprentis du
    titre Expert en cybersécurité. La bonne réponse est 76 % (77 % pour les apprentis).
  evidence: >
    La page CFA liste les taux par titre (nom du titre, puis 4 lignes de chiffres). Le chunk
    récupéré commence par les dernières lignes du titre Cybersécurité (« 79 % … 121 sur 154 »)
    et finit sur le nom du titre suivant, « Expert en Développement Logiciel ». Le préfixe ne
    donne que la section (« Taux de réussite apprentis »), pas le titre RNCP.
  cause: >
    Découpage à 300 caractères au milieu d'une liste dont chaque groupe dépend d'un titre ;
    MiniLM ne récupérait pas ce chunk, e5-large si.
  fix: >
    Les blocs des pages d'information qui ont au moins deux sous-titres h3 sont découpés en
    une section par sous-titre (« Taux de réussite apprentis — Expert en Développement
    Logiciel – [RNCP39583] »), ce qui profite aussi aux FAQ et aux coordonnées par campus.
    Avec e5-large (passage 38), q15 est correcte : 76 % pour le titre, 77 % pour les
    apprentis ; avec MiniLM en prod (passage 35), toujours 76 %.
  links: ["PR #12"]

- id: EC-15
  title: Le fichier d'exemple fictif est indexé en prod
  category: source-data
  status: fixed
  questions: [q07, q09]
  discovered_in: 2026-10-02_34_local-e5-large-300
  symptom: >
    Avec e5-large, la réponse à « Peut-on payer en plusieurs fois ? » ajoute « 1, 3 ou 10
    mensualités sans frais » : cette information n'existe pas sur le site Ynov.
  evidence: >
    Elle vient de data/samples/admissions_faq.md, un exemple créé avec le squelette du projet
    (commit 9628924) : Mastère à 10 200 €, paiement en 10 mensualités, admissions@ynov.com,
    01 40 79 00 00… Il est ingéré en prod depuis la première ingestion (doc_type faq) et
    remontait déjà parmi les sources de q09 au premier test (passage 01).
  cause: data/samples/ est ingéré comme le reste du corpus.
  fix: >
    Le fichier est déplacé dans tests/fixtures/ (fixture des tests du loader Markdown,
    marquée fictive), data/ est entièrement exclu de git et de l'image, le dossier est
    supprimé du serveur et la réingestion a retiré ses points de l'index (synchronisation de
    l'indexeur). Aucune source ne le cite plus aux passages 35 et 38.
  links: ["PR #11"]

- id: EC-16
  title: Les salutations et les remerciements sont refusés
  category: grading
  status: open
  questions: [c07.2, c08.1]
  discovered_in: 2026-10-03_04_local-conversations-jeu-c2
  symptom: >
    « Bonjour » en début de conversation et « Merci beaucoup ! » après une réponse reçoivent
    « Je n'ai pas trouvé d'information pertinente dans les documents Ynov pour répondre à
    votre question. ».
  evidence: >
    Passage 04 du 2026-10-03 (scénarios c07 et c08) : les deux sont refusés par le seuil.
    « Bonjour » sans appel du LLM ; « Merci beaucoup ! » reste inchangé après reformulation.
    Même résultat avec « D'accord, super. » à la main.
  cause: >
    Le seuil compare la question aux chunks du corpus ; une formule de politesse ne ressemble
    à aucun chunk. Sans effet dans l'API à une question, gênant dans un chat.
  fix: >
    Prévu dans le chantier #14 (abandonné le 2026-10-04, repris le même jour). Piste : repérer les messages de politesse avant la recherche (règles simples ou appel
    LLM) et répondre en une phrase, en rappelant ce que l'assistant sait faire. À mesurer avec
    les scénarios c07 et c08.

- id: EC-17
  title: Le fait cherché est dans la section récupérée, mais pas dans les chunks transmis
  category: retrieval
  status: mitigated
  questions: [q07, q11, q28]
  discovered_in: 2026-10-05_01_contexte-reference
  symptom: >
    q11 (« Comment se passe l'entretien d'admission ? ») : réponse sans la durée d'1 h alors
    que la section « Le rendez-vous d'admission » est récupérée au rang 1. q07 : les « 4
    échéances » et la remise de 500 € manquent, q28 : aucun des modules attendus.
  evidence: >
    Passage 2026-10-05_01 (corpus complet, MiniLM) : q07 0/2 faits dans le contexte, q11 1/2,
    q28 0/2, alors que le critère « bonne section » les compte réussies. Pour q11 le chunk « Durée :
    1h » (chunk 0 de la section) est au 21e rang, pour q07 le chunk « 4 échéances » au 16e.
    Simulation sans LLM : envoyer la section entière (si elle fait au plus 2 000 caractères)
    au lieu des seuls chunks retrouvés remet ces faits dans le contexte.
  cause: >
    Les sections sont coupées en chunks de 300 caractères, le LLM ne reçoit que ceux qui
    ressemblent à la question, pas le reste de leur section.
  fix: >
    Lot 2 (chantier #14) : chaque chunk d'une section de 2 000 caractères au plus porte le
    texte entier de la section (`section_text`) et le LLM reçoit la section, une fois, au lieu
    des chunks retrouvés. Passage 2026-10-05_02 : 16/22 questions avec tous leurs faits dans le
    contexte (14 avant), q07 et q11 corrigées ; de bout en bout (passage 03) q11 correcte.
    Reste les sections plus longues (q28 : programme d'un Bachelor), voir EC-05.
