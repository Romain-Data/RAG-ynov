# Edge cases found while testing the RAG. Each one is backed by a run in eval/results/
# and justifies a change (done or to do). Ids are stable: result files refer to them.
#
# status:   open | mitigated (partly fixed) | fixed | lesson (approach rejected)
# category: chunking | retrieval | grading | generation | embedding-model | eval-tooling
#           | source-data

- id: EC-01
  title: Les embeddings ne lisent que 128 tokens
  category: chunking
  status: fixed
  questions: [q02, q05, q06]
  discovered_in: 2026-10-02_09_retrieval-prefixe-long-k10-cap1
  symptom: >
    Aucune question de lieu ou de durée ne retrouvait la section « Infos clés », même
    avec 10 résultats (runs 02 à 09). En prod (run 01), « Dans quelles villes est proposé
    le Mastère IA ? » répondait « le contexte ne contient pas d'information ».
  evidence: >
    Le tokenizer de paraphrase-multilingual-MiniLM-L12-v2 tronque à 128 tokens. Avec des
    chunks de 500 caractères, plus de la moitié étaient tronqués (médiane 125 tokens,
    90e centile 128). Le chunk « Infos clés » du Mastère IA s'arrêtait à « … 11 villes
    (campus Ynov) : Aix-en-Provence, Bordeaux » : le reste n'était jamais vectorisé.
  cause: Taille des chunks (500 caractères) inadaptée à la fenêtre du modèle.
  fix: >
    Chunks de 300 caractères (1 % tronqués), constante unique CHUNK_SIZE dans
    ingestion/chunking.py. q02 passe au rang 1 (run 22), réponse correcte en prod (run 23).
  links: ["PR #5"]

- id: EC-02
  title: Question refusée à 0,003 du seuil de pertinence
  category: grading
  status: open
  questions: [q13]
  discovered_in: 2026-10-02_23_e2e-prod-apres-pr5-pr6
  symptom: >
    « Quelle est l'adresse e-mail du référent handicap de Lyon ? » est refusée en prod
    (« Je n'ai pas trouvé d'information pertinente », 0,2 s, aucune source), alors que la
    bonne section (handicap.html / Contact) est récupérée au rang 2.
  evidence: >
    Meilleur score 0,497 pour un seuil GRADE_THRESHOLD = 0,5 : le nœud grade refuse avant
    d'appeler le LLM. La réponse (handicap-lyon@ynov.com) est pourtant dans le contexte.
  cause: >
    Seuil fixé à 0,5 sans calibration ; le passage à des chunks plus courts (EC-01) a
    déplacé la distribution des scores. L'évaluation de la recherche ne modélisait pas le
    seuil, d'où l'angle mort (voir EC-10).
  fix: >
    À faire : calibrer le seuil sur la distribution des meilleurs scores, en ajoutant au
    jeu de questions des questions hors périmètre (qui doivent être refusées), pour mesurer
    à la fois les refus à tort et les réponses à tort.
  links: []

- id: EC-03
  title: Le LLM préfère une note de bas de page à l'information de lieu
  category: generation
  status: open
  questions: [q03]
  discovered_in: 2026-10-02_01_e2e-prod-premier-test
  symptom: >
    « Le Mastère Game Programmer est-il proposé à Lyon ? » → « Oui, à Lyon en contrat de
    professionnalisation ». Faux : la formation est 100 % en ligne.
  evidence: >
    Run 01 : la section de lieu n'était pas récupérée (EC-01). Run 23 : les 10 chunks
    transmis portent tous « (2 ans, 100 % en ligne, aucun campus) » dans leur en-tête, et
    le LLM donne toujours la même réponse fausse. Il s'appuie sur la note commune
    « contrat de professionnalisation … uniquement accessibles à Nice-Sophia, Aix, Lyon,
    … et Connect » de la section « Voies d'accès ».
  cause: >
    Le prompt ne dit pas que l'en-tête de chaque source (durée, lieux) fait foi ; la note
    générique est lue comme une information propre à la formation. « Lyon » n'apparaît pas
    dans le chunk « Lieux » d'une formation en ligne (score plafonné à 0,54).
  fix: >
    À faire : préciser le prompt (l'en-tête de la source donne les lieux et prime) ; vérifier
    avec eval/e2e.py (q03 answer_must_not « ^oui »).
  links: []

- id: EC-04
  title: Les tableaux d'équivalences RNCP saturent les résultats
  category: retrieval
  status: mitigated
  questions: [q08]
  discovered_in: 2026-10-02_01_e2e-prod-premier-test
  symptom: >
    « Quels sont les blocs de compétences du titre Expert en cybersécurité ? » : les 5
    sources récupérées venaient toutes de « Certifications professionnelles enregistrées au
    RNCP en correspondance partielle » (scores 0,891 à 0,901) ; aucune section de bloc.
  evidence: >
    Ces tableaux répètent les intitulés de blocs d'autres titres, très proches de la
    question. Réponse : 2 blocs sur 4.
  cause: Sections d'équivalences peu utiles et très similaires aux questions de compétences.
  fix: >
    Sections d'équivalences et références légales retirées des fiches RNCP. Le problème
    restant (1 bloc sur 4, runs 22 et 23) relève du modèle d'embedding (EC-07).
  links: ["PR #5"]

- id: EC-05
  title: Le plafond par section coupe les réponses qui s'étalent sur plusieurs chunks
  category: retrieval
  status: open
  questions: [q10]
  discovered_in: 2026-10-02_23_e2e-prod-apres-pr5-pr6
  symptom: >
    « Quels modules sont enseignés en Mastère 2 du Mastère IA ? » → un seul module cité
    (Intelligence artificielle avancée) sur trois.
  evidence: >
    Avec des chunks de 300 caractères, la section « Programme du Mastère » compte une
    vingtaine de chunks ; MAX_PER_SECTION = 2 n'en laisse passer que deux.
  cause: >
    Compromis introduit par PR #5 : le plafond diversifie les sources (utile pour q08, EC-04)
    mais pénalise les longues sections.
  fix: >
    À faire : une section par module (« Programme — Mastère 2 — Module 1 ») pour que le
    plafond s'applique par module ; à mesurer avec eval/retrieval.py et eval/e2e.py.
  links: []

- id: EC-06
  title: Une question générale se noie dans les cas particuliers
  category: generation
  status: open
  questions: [q07]
  discovered_in: 2026-10-02_01_e2e-prod-premier-test
  symptom: >
    « Peut-on payer les frais de scolarité en plusieurs fois ? » → « oui », mais la réponse
    liste des tarifs de BTS et omet les règles générales (4 échéances, remise de 500 € au
    comptant), et conclut en prod (run 23) que c'est « probablement » possible partout.
  evidence: >
    Le document commun (Modalités de paiement) est récupéré (rang 3 ou 4), noyé parmi les
    sections Tarifs de chaque formation.
  cause: >
    Le prompt ne demande pas de privilégier l'information générale pour une question
    générale ; les sections Tarifs, nombreuses et proches, dominent le contexte.
  fix: >
    À faire : ajustement du prompt ; vérifier avec eval/e2e.py (q07).
  links: []

- id: EC-07
  title: Limites du modèle d'embedding
  category: embedding-model
  status: open
  questions: [q08, q16]
  discovered_in: 2026-10-02_22_retrieval-final-pr5
  symptom: >
    Après PR #5, deux questions échouent encore en recherche : les blocs Cybersécurité
    (1 section de bloc sur 3 attendues) et « Quels BTS sont accessibles via Parcoursup ? »
    (la section Parcoursup de la page Admission n'est jamais récupérée, les pages BTS passent
    devant).
  evidence: >
    paraphrase-multilingual-MiniLM-L12-v2 est un petit modèle de paraphrase (384 dimensions,
    128 tokens), faible pour rapprocher une question d'un passage.
  cause: Capacité du modèle.
  fix: >
    Prévu : comparer avec intfloat/multilingual-e5-large (512 tokens) via eval/retrieval.py,
    en tenant compte du coût (modèle de 2,2 Go, ingestion et requêtes plus lentes).
  links: []

- id: EC-08
  title: Un préfixe long dégrade la recherche
  category: chunking
  status: lesson
  questions: [q10, q14]
  discovered_in: 2026-10-02_06_retrieval-prefixe-long-k5
  symptom: >
    Mettre la liste complète des campus dans le préfixe de chaque chunk a fait baisser le
    score de 9/16 à 7/16 (5 résultats) : q10 et q14 ont été perdues.
  evidence: >
    Le préfixe consommait une grande part des 128 tokens (EC-01) et rendait tous les chunks
    d'une formation très similaires entre eux.
  cause: Préfixe trop long pour la fenêtre du modèle.
  fix: >
    Approche abandonnée au profit d'un préfixe compact (« 2 ans, 11 campus et en ligne ») ;
    la liste complète reste dans la section « Lieux ».
  links: ["PR #5"]

- id: EC-09
  title: "Les fiches « clé : valeur » sont mal appariées aux questions"
  category: embedding-model
  status: fixed
  questions: [q03, q05, q06]
  discovered_in: 2026-10-02_13_retrieval-300-prefixe-court-k10-cap1
  symptom: >
    Même sans troncature, le chunk « Infos clés » restait mal classé : 54e pour la question
    Game Programmer / Lyon, 31e pour le BTS ERA.
  evidence: >
    Score de la question « Où peut-on suivre le Mastère Game Programmer ? » : 0,52 contre la
    fiche « Durée : 2 ans … », 0,68 contre une formulation question + réponse.
  cause: >
    Modèle entraîné sur des paraphrases : il rapproche mieux une question d'une question que
    d'une liste de valeurs.
  fix: >
    « Infos clés » rédigées en questions-réponses et nouvelle section « Lieux ». q06 passe au
    rang 1, q05 au rang 6.
  links: ["PR #5"]

- id: EC-10
  title: Angles morts de l'évaluation
  category: eval-tooling
  status: fixed
  questions: [q03, q04, q13]
  discovered_in: 2026-10-02_22_retrieval-final-pr5
  symptom: >
    (a) Le critère « bonne section récupérée » comptait q03/q04 en échec alors que
    « 100 % en ligne » arrivait au LLM par l'en-tête de chaque chunk. (b) L'évaluation ne
    modélisait pas le seuil de pertinence : q13 passait en local mais était refusée en prod
    (EC-02). (c) Une bonne recherche ne garantit pas une bonne réponse (EC-03).
  evidence: Écarts entre le run 22 (recherche, 14/16) et le run 23 (prod, 10/16 correctes).
  cause: Évaluation limitée à la recherche, sans seuil ni contrôle des réponses.
  fix: >
    (a) critère expect_text (jeu de questions v3) ; (b) top_score et refused_by_threshold
    enregistrés par eval/retrieval.py ; (c) eval/e2e.py vérifie les réponses du LLM
    (answer_must / answer_must_not) et enregistre un verdict.
  links: ["PR #5", "feat/eval-reporting"]

- id: EC-11
  title: Erreurs dans les contenus du site Ynov
  category: source-data
  status: open
  questions: []
  discovered_in: null
  symptom: >
    (1) La page Bachelor Informatique contient une section « Voie d'accès » copiée depuis
    Architecture d'intérieur (« diplôme de niveau 5 … dans le domaine de l'architecture
    d'intérieur »). (2) La page Mastère Expert en jumeaux numériques contient une note
    interne publiée : « Formulation à recaler sur le référentiel officiel avec l'équipe
    certification. »
  evidence: Relevé lors du scraping des 42 formations (PR #1).
  cause: Contenu source.
  fix: À signaler à Ynov ; le RAG restitue ces contenus tels quels.
  links: ["PR #1"]
