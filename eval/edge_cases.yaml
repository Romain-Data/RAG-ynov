- id: EC-18
  title: Le critère « bonne section récupérée » surestime la recherche
  category: eval-tooling
  status: fixed
  questions: [q07, q10, q11]
  discovered_in: 2026-10-05_01_contexte-reference
  symptom: >
    La recherche affichait 14/16 (CI) alors que le bout en bout en donnait 11/16 : q07, q10
    et q11 passaient en recherche et échouaient dans les réponses.
  evidence: >
    Passage 2026-10-05_01 : 18/22 sections trouvées, mais 14/22 questions dont tous les faits
