# RAG evaluation set. Question ids are stable: results and edge cases refer to them.
#
# Retrieval (eval/retrieval.py): a question passes when at least `min_distinct`
# (default 1) distinct sections matching an `expect` entry are in the retrieved chunks,
# or when `expect_text` (optional) appears in a retrieved chunk of an expected source.
# `source` is the file name, `section` a case-insensitive substring of the section title.
#
# Answers (eval/e2e.py): every `answer_must` regex must match the LLM answer and no
# `answer_must_not` regex may match (case-insensitive).
#
# Out-of-scope questions (`out_of_scope`) must not get an answer:
#   threshold  the grading threshold must refuse them (also checked by eval/retrieval.py)
#   llm        they pass the threshold (e.g. other schools): the LLM must decline
#              (only checked by eval/e2e.py)
# An out-of-scope answer is correct when refused or declined.
#
# Question set versions (recorded in each result file):
#   v1  initial set (2026-10-02)
#   v2  location questions (q02-q05) also accept the new "Lieux" section
#   v3  q03/q04 also pass when "100 % en ligne" reaches the context (expect_text)
#   v4  ids and answer checks added; retrieval criteria unchanged from v3
#   v5  q17-q26 out-of-scope questions, to calibrate the grading threshold (EC-02);
#       q16 answer_must_not (other BTS named or "all BTS", EC-13)
#   v6  q07 answer check: the 500 € discount only ("9 500 €" matched before)

- id: q01
  question: Combien coûte le Mastère Expert en intelligence artificielle ?
  expect:
    - {source: mastere-expert-en-intelligence-artificielle.html, section: Tarifs}
  answer_must: ['9[  ]?000', '9[  ]?500']

- id: q02
  question: Dans quelles villes est proposé le Mastère Expert en intelligence artificielle ?
