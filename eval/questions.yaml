    - {source: mastere-expert-en-intelligence-artificielle.html, section: Infos clés}
    - {source: mastere-expert-en-intelligence-artificielle.html, section: Lieux}
  answer_must: [Aix-en-Provence, Strasbourg, en ligne]

- id: q03
  question: Le Mastère Game Programmer est-il proposé à Lyon ?
