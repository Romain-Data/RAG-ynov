[project]
name = "rag-ynov"
version = "0.1.0"
description = "RAG pédagogique sur programmes Ynov + admissions — LangGraph + Qdrant + FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.8",
    "langgraph>=0.2",
    # Same minor version as the Qdrant server (docker-compose.yml: qdrant/qdrant:v1.19.1):
    # the client supports a server at most one minor version apart.
    "qdrant-client>=1.19,<1.20",
    # Pinned: an upgrade can change the vectors (after 0.5.1 this model moved to mean pooling),
    # making query vectors inconsistent with the indexed ones until a re-ingestion.
    "fastembed==0.8.0",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "langchain-text-splitters>=0.3",
    "pyyaml>=6.0",
    "slowapi>=0.1.9",
    "beautifulsoup4>=4.15.0",
    "chainlit==2.12.0",
    "requests>=2.32",
    "greenlet>=3.1",
    "aiosqlite>=0.20",
    "sqlalchemy>=2.0",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ingestion", "graph"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "ARG", "PTH"]
ignore = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
